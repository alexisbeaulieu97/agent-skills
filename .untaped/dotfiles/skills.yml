# Every skill, linked into the two folders agent harnesses read on a machine. The skills
# live in .claude/skills, where cloud sessions (Claude Code Projects) load them when this
# repository is added to a project.
version: 1
description: Agent skills, for Claude Code (~/.claude/skills) and other harnesses (~/.agents/skills)
policy: sync
items:
  skills:
    files:
      - {path: .claude/skills, target: ~/.claude/skills}
      - {path: .claude/skills, target: ~/.agents/skills}
